name: Android APK build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build variant'
        type: choice
        options: [debug, release]
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Install JS deps
        working-directory: apps/mobile
        run: npm ci

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: gradle-${{ hashFiles('apps/mobile/android/**') }}
          restore-keys: gradle-


      - name: Generate native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Inject signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/app/debug.keystore

      - name: Determine build variant
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: apps/mobile/android
        run: |
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: card-sage-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Publish GitHub Release (tag pushes only)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
